<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-desktop</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; padding-top: 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
         background: #0f1117; color: #e6e8ee; font-family: system-ui, "Segoe UI", sans-serif; }
  main { text-align: center; max-width: 560px; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p.status { color: #9aa3b5; font-size: 14px; margin: 0; }
  .spinner { width: 28px; height: 28px; margin: 0 auto 20px; border: 3px solid #2a3040;
             border-top-color: #4d9fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  pre.error { display: none; text-align: left; background: #1a1e2a; border: 1px solid #3a2230;
              border-radius: 8px; padding: 12px 16px; font-size: 12px; color: #ffb4c8;
              white-space: pre-wrap; word-break: break-all; margin-top: 16px; }
</style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <h1>dsh-desktop</h1>
    <p class="status" id="status">正在启动 dsh 运行时…</p>
    <pre class="error" id="error"></pre>
  </main>
  <script src="titlebar.js"></script>
  <script>
    // Called by the Rust host when the dsh runtime fails to boot.
    window.__dshBootError = function (message) {
      var spinner = document.querySelector('.spinner');
      var error = document.getElementById('error');
      if (spinner) spinner.style.display = 'none';
      document.getElementById('status').textContent = '启动失败';
      error.textContent = message;
      error.style.display = 'block';
    };
  </script>
</body>
</html>
