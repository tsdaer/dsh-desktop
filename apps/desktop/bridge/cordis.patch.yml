# dsh-desktop-bridge rows. The shell appends this file to the profile's
# cordis.patch.yml at install time so the rows compose in the user layer
# (later profile patches can configure them; the --patch overlay would be
# applied after the user layer and could not be patched by it).
- insert:
    - id: desktop-bridge
      name: '@deepseek-ai/dsh-desktop-bridge'

    - id: desktop-bridge-client
      name: '@deepseek-ai/dsh-desktop-bridge-client'

# Desktop settings defaults: edit this entry to change the out-of-box
# behavior (the in-app settings page overrides these).
- id: desktop-bridge
  config:
    closeToTray: false
    debugMode: false
    explorerMaxEntries: 256
    explorerMaxBytes: 131072
    explorerTimeoutMs: 5000
    searchMaxMatches: 50
    searchMaxBytes: 131072
    searchMaxRawBytes: 2097152
    searchMaxFileBytes: 2097152
    searchGraceMs: 1000
    searchTimeoutMs: 5000
    sourceControlMaxEntries: 256
    sourceControlMaxBytes: 131072
    sourceControlGraceMs: 1000
    sourceControlTimeoutMs: 5000
