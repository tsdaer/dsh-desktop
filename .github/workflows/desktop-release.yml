# Build target-native desktop release candidates only for an explicit release
# tag. Windows and Linux build their own sidecars and native runtimes; the
# release job combines only the staged artifacts produced by those jobs.
name: Draft desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: validate desktop release ref
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and verify the desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require("./apps/desktop/package.json").version')"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          node apps/desktop/scripts/sync-version.mjs --check
          node apps/desktop/scripts/changelog-section.mjs "$PACKAGE_VERSION" >/dev/null
          test "${GITHUB_REF_TYPE}" = tag
          test "${GITHUB_REF_NAME}" = "$EXPECTED_TAG"
          {
            echo "version=${PACKAGE_VERSION}"
            echo "tag=${EXPECTED_TAG}"
            echo "commit=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: build Windows x64 NSIS
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build the workspace (CLI + web frontend)
        run: pnpm run build

      - name: Verify updater signing input
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required for desktop updater releases'
          }

      - name: Bundle the Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: pnpm --filter @deepseek-ai/dsh-desktop bundle -- --target x86_64-pc-windows-msvc

      - name: Check and stage the Windows artifacts
        shell: pwsh
        run: |
          pnpm --filter @deepseek-ai/dsh-desktop size-check -- --target x86_64-pc-windows-msvc
          node apps/desktop/scripts/release-artifacts.mjs --target x86_64-pc-windows-msvc --output "$env:RUNNER_TEMP\dsh-desktop-artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dsh-desktop-artifacts/windows-x64
          if-no-files-found: error

  build-linux:
    name: build Linux x64 AppImage and deb
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils \
            xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build the workspace (CLI + web frontend)
        run: pnpm run build

      - name: Verify updater signing input
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Bundle the Linux installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @deepseek-ai/dsh-desktop bundle -- --target x86_64-unknown-linux-gnu

      - name: Check and stage the Linux artifacts
        run: |
          pnpm --filter @deepseek-ai/dsh-desktop size-check -- --target x86_64-unknown-linux-gnu
          node apps/desktop/scripts/release-artifacts.mjs --target x86_64-unknown-linux-gnu --output "$RUNNER_TEMP/dsh-desktop-artifacts"

      - name: Smoke-test the packaged AppImage
        run: |
          APPIMAGE="$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' \
            pnpm --filter @deepseek-ai/dsh-desktop packaged-smoke -- \
              --target x86_64-unknown-linux-gnu --artifact "$APPIMAGE"

      - name: Smoke-test install and removal of the deb package
        run: |
          DEB="$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' \
            pnpm --filter @deepseek-ai/dsh-desktop packaged-smoke -- \
              --target x86_64-unknown-linux-gnu --artifact "$DEB" --install-deb

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-x64-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dsh-desktop-artifacts/linux-x64
          if-no-files-found: error

  draft-release:
    name: draft release for the desktop version
    needs: [validate, build-windows, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Check the existing release state
        id: check
        run: |
          if DRAFT="$(gh release view "${{ needs.validate.outputs.tag }}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "is_draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-windows-x64-${{ needs.validate.outputs.version }}
          path: dist/windows-x64

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux-x64-${{ needs.validate.outputs.version }}
          path: dist/linux-x64

      - name: Verify the complete staged inventory
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --version "${{ needs.validate.outputs.version }}" \
            --output dist

      - name: Record release artifact hashes
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Build the updater manifest
        run: |
          node apps/desktop/scripts/updater-manifest.mjs \
            "${{ needs.validate.outputs.version }}" \
            "${{ needs.validate.outputs.tag }}" \
            dist

      - name: Create the draft release
        if: steps.check.outputs.exists == 'false'
        run: |
          node apps/desktop/scripts/changelog-section.mjs "${{ needs.validate.outputs.version }}" > release-notes.md
          gh release create "${{ needs.validate.outputs.tag }}" \
            --draft \
            --title "dsh-desktop v${{ needs.validate.outputs.version }}" \
            --target "${{ needs.validate.outputs.commit }}" \
            --notes-file release-notes.md \
            dist/windows-x64/* dist/linux-x64/* latest.json SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh the draft release
        if: steps.check.outputs.exists == 'true' && steps.check.outputs.is_draft == 'true'
        run: |
          node apps/desktop/scripts/changelog-section.mjs "${{ needs.validate.outputs.version }}" > release-notes.md
          gh release edit "${{ needs.validate.outputs.tag }}" \
            --title "dsh-desktop v${{ needs.validate.outputs.version }}" \
            --notes-file release-notes.md
          gh release upload "${{ needs.validate.outputs.tag }}" \
            dist/windows-x64/* dist/linux-x64/* latest.json SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
