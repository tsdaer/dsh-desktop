# Build target-native desktop release candidates only for an explicit release
# tag. Windows and Linux build their own sidecars and native runtimes. A
# signed macOS lane is opt-in until the repository owns its Apple credentials;
# the release job combines only staged artifacts from completed target lanes.
name: Draft desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: validate desktop release ref
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and verify the desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require("./apps/desktop/package.json").version')"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          node apps/desktop/scripts/sync-version.mjs --check
          node apps/desktop/scripts/changelog-section.mjs "$PACKAGE_VERSION" >/dev/null
          test "${GITHUB_REF_TYPE}" = tag
          test "${GITHUB_REF_NAME}" = "$EXPECTED_TAG"
          {
            echo "version=${PACKAGE_VERSION}"
            echo "tag=${EXPECTED_TAG}"
            echo "commit=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: build Windows x64 NSIS
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify the validated source commit
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ needs.validate.outputs.commit }}') {
            throw 'desktop release checkout does not match the validated commit'
          }

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build the workspace (CLI + web frontend)
        run: pnpm run build

      - name: Verify updater signing input
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required for desktop updater releases'
          }

      - name: Bundle the Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: pnpm --filter @deepseek-ai/dsh-desktop bundle -- --target x86_64-pc-windows-msvc

      - name: Check and stage the Windows artifacts
        shell: pwsh
        run: |
          pnpm --filter @deepseek-ai/dsh-desktop size-check -- --target x86_64-pc-windows-msvc
          node apps/desktop/scripts/release-artifacts.mjs --target x86_64-pc-windows-msvc --output "$env:RUNNER_TEMP\dsh-desktop-artifacts"

      - name: Smoke-test the installed Windows NSIS package
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($installer)) { throw 'Windows NSIS installer was not produced' }
          pnpm --filter @deepseek-ai/dsh-desktop packaged-smoke -- --target x86_64-pc-windows-msvc --artifact $installer --install-nsis --terminal-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dsh-desktop-artifacts/windows-x64
          if-no-files-found: error

  build-linux:
    name: build Linux x64 AppImage and deb
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            webkit2gtk-driver \
            xdg-utils \
            xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify the validated source commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.commit }}"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Record the Linux desktop baseline
        run: pnpm --filter @deepseek-ai/dsh-desktop linux-baseline -- --target x86_64-unknown-linux-gnu --output "$RUNNER_TEMP/dsh-desktop-linux-baseline.json"

      - name: Build the workspace (CLI + web frontend)
        run: pnpm run build

      - name: Verify updater signing input
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Bundle the Linux installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @deepseek-ai/dsh-desktop bundle -- --target x86_64-unknown-linux-gnu

      - name: Check and stage the Linux artifacts
        run: |
          pnpm --filter @deepseek-ai/dsh-desktop size-check -- --target x86_64-unknown-linux-gnu
          node apps/desktop/scripts/release-artifacts.mjs --target x86_64-unknown-linux-gnu --output "$RUNNER_TEMP/dsh-desktop-artifacts"

      - name: Install Chromium for packaged web UI smoke
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Smoke-test the packaged AppImage
        run: |
          APPIMAGE="$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' \
            pnpm --filter @deepseek-ai/dsh-desktop packaged-smoke -- \
              --target x86_64-unknown-linux-gnu --artifact "$APPIMAGE" \
              --terminal-smoke

      - name: Smoke-test install and removal of the deb package
        env:
          DSH_PACKAGED_WEB_SMOKE_SCREENSHOT: ${{ runner.temp }}/dsh-desktop-packaged-web-smoke.png
        run: |
          DEB="$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' \
            pnpm --filter @deepseek-ai/dsh-desktop packaged-smoke -- \
              --target x86_64-unknown-linux-gnu --artifact "$DEB" --install-deb \
              --terminal-smoke --web-smoke

      - name: Upload installed Linux package web UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-packaged-web-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dsh-desktop-packaged-web-smoke.png
          if-no-files-found: ignore

      - name: Install the Linux native WebDriver
        run: cargo install tauri-driver --locked

      - name: Exercise the installed Tauri WebView and terminal card
        env:
          DSH_NATIVE_UI_SCREENSHOT: ${{ runner.temp }}/dsh-desktop-native-ui.png
        run: |
          set -euo pipefail
          DEB="$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          xvfb-run --auto-servernum --server-args='-screen 0 1680x1000x24' \
            pnpm --filter @deepseek-ai/dsh-desktop native-ui-smoke -- \
              --target x86_64-unknown-linux-gnu --artifact "$DEB" \
              --screenshot "$DSH_NATIVE_UI_SCREENSHOT"

      - name: Upload Linux native Tauri UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-native-ui-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dsh-desktop-native-ui.png
          if-no-files-found: ignore

      - name: Replay the Linux terminal UI through the assembled Web profile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-desktop-web-e2e"
          xvfb-run --auto-servernum --server-args='-screen 0 1680x1000x24' \
            env DSH_SNAPSHOT=replay pnpm exec vitest run \
              --config vitest.web.config.ts \
              apps/web/tests/navigation-panes.e2e.ts \
              2>&1 | tee "$RUNNER_TEMP/dsh-desktop-web-e2e/navigation-panes.log"

      - name: Upload Linux terminal UI replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-terminal-ui-${{ needs.validate.outputs.version }}
          path: |
            ${{ runner.temp }}/dsh-desktop-web-e2e/navigation-panes.log
            .artifacts/web-e2e-navigation-terminal.png
          if-no-files-found: ignore

      - name: Upload Linux baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-baseline-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dsh-desktop-linux-baseline.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-x64-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dsh-desktop-artifacts/linux-x64
          if-no-files-found: error

  build-macos-experimental:
    name: build macOS arm64 unsigned experimental bundle
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify the validated source commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.commit }}"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build the workspace (CLI + web frontend)
        run: pnpm run build

      - name: Bundle the unsigned macOS experimental artifact
        run: pnpm --filter @deepseek-ai/dsh-desktop bundle -- --target aarch64-apple-darwin --experimental

      - name: Check the macOS experimental artifact size
        run: pnpm --filter @deepseek-ai/dsh-desktop size-report -- --check --target aarch64-apple-darwin --experimental

      - name: Smoke-test the unsigned macOS app bundle
        run: |
          APP="$(find "$(pwd)/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          pnpm --filter @deepseek-ai/dsh-desktop packaged-smoke -- \
            --target aarch64-apple-darwin --artifact "$APP" \
            --terminal-smoke

      - name: Smoke-test the unsigned macOS dmg
        run: |
          DMG="$(find "$(pwd)/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          pnpm --filter @deepseek-ai/dsh-desktop packaged-smoke -- \
            --target aarch64-apple-darwin --artifact "$DMG" --install-dmg \
            --terminal-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos-arm64-experimental-${{ needs.validate.outputs.version }}
          path: |
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          if-no-files-found: error

  build-macos-signed:
    name: build and notarize macOS arm64 release bundle
    if: vars.DSH_DESKTOP_MACOS_RELEASE == 'true'
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify the validated source commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.commit }}"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build the workspace (CLI + web frontend)
        run: pnpm run build

      - name: Verify macOS signing inputs
        env:
          DSH_MACOS_CERTIFICATE_BASE64: ${{ secrets.DSH_MACOS_CERTIFICATE_BASE64 }}
          DSH_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.DSH_MACOS_CERTIFICATE_PASSWORD }}
          DSH_MACOS_SIGNING_IDENTITY: ${{ secrets.DSH_MACOS_SIGNING_IDENTITY }}
          DSH_MACOS_APPLE_ID: ${{ secrets.DSH_MACOS_APPLE_ID }}
          DSH_MACOS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DSH_MACOS_APPLE_APP_SPECIFIC_PASSWORD }}
          DSH_MACOS_APPLE_TEAM_ID: ${{ secrets.DSH_MACOS_APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DSH_MACOS_CERTIFICATE_BASE64"
          test -n "$DSH_MACOS_CERTIFICATE_PASSWORD"
          test -n "$DSH_MACOS_SIGNING_IDENTITY"
          test -n "$DSH_MACOS_APPLE_ID"
          test -n "$DSH_MACOS_APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$DSH_MACOS_APPLE_TEAM_ID"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          DSH_MACOS_CERTIFICATE_BASE64: ${{ secrets.DSH_MACOS_CERTIFICATE_BASE64 }}
          DSH_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.DSH_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/dsh-desktop-signing.keychain-db"
          certificate="$RUNNER_TEMP/dsh-desktop-signing.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$DSH_MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g' | sed '/^$/d' > "$RUNNER_TEMP/dsh-desktop-keychains.txt"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$DSH_MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          {
            echo "DSH_MACOS_KEYCHAIN=$keychain"
            echo "DSH_MACOS_CERTIFICATE_FILE=$certificate"
          } >> "$GITHUB_ENV"

      - name: Bundle the signed macOS artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.DSH_MACOS_SIGNING_IDENTITY }}
        run: pnpm --filter @deepseek-ai/dsh-desktop bundle -- --target aarch64-apple-darwin

      - name: Sign, notarize, staple, and verify the app
        env:
          DSH_MACOS_APP: ${{ github.workspace }}/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/dsh-desktop.app
          DSH_MACOS_DMG: ${{ github.workspace }}/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/dsh-desktop_*.dmg
          DSH_MACOS_ARCHIVE: ${{ github.workspace }}/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/dsh-desktop_*.app.tar.gz
          MACOS_SIGNING_IDENTITY: ${{ secrets.DSH_MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.DSH_MACOS_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DSH_MACOS_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DSH_MACOS_APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export DSH_MACOS_DMG="$(find "$(dirname "$DSH_MACOS_DMG")" -maxdepth 1 -name '*.dmg' -print -quit)"
          export DSH_MACOS_ARCHIVE="$(find "$(dirname "$DSH_MACOS_ARCHIVE")" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$DSH_MACOS_DMG"
          test -n "$DSH_MACOS_ARCHIVE"
          pnpm --filter @deepseek-ai/dsh-desktop exec node scripts/macos-sign-release.mjs

      - name: Check and stage the signed macOS artifacts
        run: |
          pnpm --filter @deepseek-ai/dsh-desktop size-check -- --target aarch64-apple-darwin
          node apps/desktop/scripts/release-artifacts.mjs --target aarch64-apple-darwin --output "$RUNNER_TEMP/dsh-desktop-artifacts"

      - name: Smoke-test the signed macOS app bundle
        run: |
          APP="$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          pnpm --filter @deepseek-ai/dsh-desktop packaged-smoke -- \
            --target aarch64-apple-darwin --artifact "$APP" \
            --terminal-smoke

      - name: Smoke-test the signed macOS dmg
        run: |
          DMG="$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          pnpm --filter @deepseek-ai/dsh-desktop packaged-smoke -- \
            --target aarch64-apple-darwin --artifact "$DMG" --install-dmg \
            --terminal-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos-arm64-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dsh-desktop-artifacts/macos-arm64
          if-no-files-found: error

      - name: Remove the temporary signing keychain
        if: always()
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/dsh-desktop-keychains.txt" ]; then
            keychains=()
            while IFS= read -r keychain; do
              [ -n "$keychain" ] && keychains+=("$keychain")
            done < "$RUNNER_TEMP/dsh-desktop-keychains.txt"
            if [ "${#keychains[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${keychains[@]}"
            fi
          fi
          keychain="${DSH_MACOS_KEYCHAIN:-$RUNNER_TEMP/dsh-desktop-signing.keychain-db}"
          certificate="${DSH_MACOS_CERTIFICATE_FILE:-$RUNNER_TEMP/dsh-desktop-signing.p12}"
          security delete-keychain "$keychain"
          rm -f "$certificate" "$RUNNER_TEMP/dsh-desktop-keychains.txt"

  draft-release:
    name: draft release for the desktop version
    needs: [validate, build-windows, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Verify the validated source commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.commit }}"

      - name: Check the existing release state
        id: check
        run: |
          if DRAFT="$(gh release view "${{ needs.validate.outputs.tag }}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "is_draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-windows-x64-${{ needs.validate.outputs.version }}
          path: dist/windows-x64

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux-x64-${{ needs.validate.outputs.version }}
          path: dist/linux-x64

      - name: Verify the complete staged inventory
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --version "${{ needs.validate.outputs.version }}" \
            --output dist

      - name: Record release artifact hashes
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Build the updater manifest
        run: |
          node apps/desktop/scripts/updater-manifest.mjs \
            "${{ needs.validate.outputs.version }}" \
            "${{ needs.validate.outputs.tag }}" \
            dist

      - name: Create the draft release
        if: steps.check.outputs.exists == 'false'
        run: |
          node apps/desktop/scripts/changelog-section.mjs "${{ needs.validate.outputs.version }}" > release-notes.md
          gh release create "${{ needs.validate.outputs.tag }}" \
            --draft \
            --title "dsh-desktop v${{ needs.validate.outputs.version }}" \
            --target "${{ needs.validate.outputs.commit }}" \
            --notes-file release-notes.md \
            dist/windows-x64/* dist/linux-x64/* latest.json SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh the draft release
        if: steps.check.outputs.exists == 'true' && steps.check.outputs.is_draft == 'true'
        run: |
          node apps/desktop/scripts/changelog-section.mjs "${{ needs.validate.outputs.version }}" > release-notes.md
          gh release edit "${{ needs.validate.outputs.tag }}" \
            --title "dsh-desktop v${{ needs.validate.outputs.version }}" \
            --notes-file release-notes.md
          gh release upload "${{ needs.validate.outputs.tag }}" \
          dist/windows-x64/* dist/linux-x64/* latest.json SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  attach-macos-signed:
    name: attach signed macOS artifacts to the draft
    if: needs.build-macos-signed.result == 'success' && needs.draft-release.result == 'success'
    needs: [validate, draft-release, build-macos-signed]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Verify the validated source commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.commit }}"

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-windows-x64-${{ needs.validate.outputs.version }}
          path: dist/windows-x64

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux-x64-${{ needs.validate.outputs.version }}
          path: dist/linux-x64

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-macos-arm64-${{ needs.validate.outputs.version }}
          path: dist/macos-arm64

      - name: Verify and hash the complete staged inventory
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify --version "${{ needs.validate.outputs.version }}" --output dist
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Rebuild the updater manifest with macOS
        run: node apps/desktop/scripts/updater-manifest.mjs "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.tag }}" dist

      - name: Upload signed macOS artifacts and refreshed metadata
        run: gh release upload "${{ needs.validate.outputs.tag }}" dist/macos-arm64/* latest.json SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  attach-macos-experimental:
    name: attach unsigned macOS experimental artifacts to the draft
    if: needs.build-macos-experimental.result == 'success' && needs.draft-release.result == 'success'
    needs: [validate, draft-release, build-macos-experimental]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Verify the validated source commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.commit }}"

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-macos-arm64-experimental-${{ needs.validate.outputs.version }}
          path: dist/macos-arm64-experimental

      - name: Package the unsigned macOS app bundle for the Release
        run: |
          set -euo pipefail
          app="$(find dist/macos-arm64-experimental -type d -name '*.app' -print -quit)"
          test -n "$app"
          tar -czf \
            "dist/macos-arm64-experimental/dsh-desktop_${{ needs.validate.outputs.version }}_macos-arm64-experimental.app.tar.gz" \
            -C "$(dirname "$app")" "$(basename "$app")"

      - name: Upload unsigned macOS experimental artifacts
        run: |
          set -euo pipefail
          dmg="$(find dist/macos-arm64-experimental -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          gh release upload "${{ needs.validate.outputs.tag }}" \
            "$dmg" \
            dist/macos-arm64-experimental/*.app.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
