# Build the dsh-desktop NSIS installer only for an explicit release tag. A
# manual run must select the same tag, so rebuilt assets cannot drift from the
# source named by the Release. The validated version comes from package.json
# and must match tauri.conf.json, Cargo.toml, Cargo.lock, the vX.Y.Z tag, and
# the Chinese Changelog section before the Windows build starts.
name: Draft desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: validate desktop release ref
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and verify the desktop version
        id: version
        shell: pwsh
        run: |
          $PackageVersion = node -p 'require("./apps/desktop/package.json").version'
          $ExpectedTag = "v${PackageVersion}"
          node apps/desktop/scripts/sync-version.mjs --check
          if ($LASTEXITCODE -ne 0) {
            throw 'desktop version sources disagree with package.json; see the sync-version output above'
          }
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne $ExpectedTag) {
            throw "desktop release must run from tag ${ExpectedTag}; selected ref is $($env:GITHUB_REF)"
          }
          node apps/desktop/scripts/changelog-section.mjs $PackageVersion | Out-Null
          "version=${PackageVersion}" >> $env:GITHUB_OUTPUT
          "tag=${ExpectedTag}" >> $env:GITHUB_OUTPUT

  build:
    name: build the NSIS installer
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build the workspace (CLI + web frontend)
        run: pnpm run build

      - name: Verify updater signing input
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required for desktop updater releases'
          }

      - name: Bundle the desktop installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: pnpm --filter @deepseek-ai/dsh-desktop bundle

      - name: Check the payload size gate
        run: pnpm --filter @deepseek-ai/dsh-desktop size-check

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  draft-release:
    name: draft release for the desktop version
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the existing release state
        id: check
        run: |
          if DRAFT="$(gh release view "${{ needs.validate.outputs.tag }}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "is_draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-installer
          path: dist

      - name: Build the updater manifest
        run: |
          node apps/desktop/scripts/updater-manifest.mjs "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.tag }}" dist

      - name: Create the draft release
        if: steps.check.outputs.exists == 'false'
        run: |
          node apps/desktop/scripts/changelog-section.mjs "${{ needs.validate.outputs.version }}" > release-notes.md
          gh release create "${{ needs.validate.outputs.tag }}" \
            --draft \
            --title "dsh-desktop v${{ needs.validate.outputs.version }}" \
            --target "${{ github.sha }}" \
            --notes-file release-notes.md \
            dist/*.exe dist/*.exe.sig latest.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh the draft release
        if: steps.check.outputs.exists == 'true' && steps.check.outputs.is_draft == 'true'
        run: |
          node apps/desktop/scripts/changelog-section.mjs "${{ needs.validate.outputs.version }}" > release-notes.md
          gh release edit "${{ needs.validate.outputs.tag }}" \
            --title "dsh-desktop v${{ needs.validate.outputs.version }}" \
            --notes-file release-notes.md
          gh release upload "${{ needs.validate.outputs.tag }}" dist/*.exe --clobber
          gh release upload "${{ needs.validate.outputs.tag }}" dist/*.exe.sig latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
