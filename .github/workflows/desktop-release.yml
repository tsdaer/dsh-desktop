# Build the dsh-desktop NSIS installer and keep a draft GitHub release for the
# current version. The version is read from apps/desktop/package.json (kept in
# sync with apps/desktop/src-tauri/tauri.conf.json; the job fails loudly if they
# drift). Three outcomes on the release side: no release yet -> create a draft
# with the installer attached; a draft already exists -> refresh its notes and
# replace the installer; a published release exists -> leave it alone. The
# release notes come from the matching CHANGELOG.zh.md section.
# workflow_dispatch also runs it manually.
name: Draft desktop release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build the NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build the workspace (CLI + web frontend)
        run: pnpm run build

      - name: Bundle the desktop installer
        run: pnpm --filter @deepseek-ai/dsh-desktop bundle

      - name: Check the payload size gate
        run: pnpm --filter @deepseek-ai/dsh-desktop size-check

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  draft-release:
    name: draft release for the desktop version
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and verify the desktop version
        id: version
        run: |
          PKG_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          TAURI_VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "$PKG_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::package.json version ${PKG_VERSION} != tauri.conf.json version ${TAURI_VERSION}; run \`pnpm --filter @deepseek-ai/dsh-desktop sync-version\` and commit the result"
            exit 1
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check the existing release state
        id: check
        run: |
          if DRAFT="$(gh release view "${{ steps.version.outputs.tag }}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "is_draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-installer
          path: dist

      - name: Create the draft release
        if: steps.check.outputs.exists == 'false'
        run: |
          node apps/desktop/scripts/changelog-section.mjs "${{ steps.version.outputs.version }}" > release-notes.md
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "dsh-desktop v${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --notes-file release-notes.md \
            dist/*.exe
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh the draft release
        if: steps.check.outputs.exists == 'true' && steps.check.outputs.is_draft == 'true'
        run: |
          node apps/desktop/scripts/changelog-section.mjs "${{ steps.version.outputs.version }}" > release-notes.md
          gh release edit "${{ steps.version.outputs.tag }}" \
            --title "dsh-desktop v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
          gh release upload "${{ steps.version.outputs.tag }}" dist/*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
